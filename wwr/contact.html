<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Whitewater Rafting</title>
    <meta name="description"
      content="Get in touch with Whitewater Rafting for reservations, general inquiries, or feedback. We are here to help you plan your next river adventure.">
    <meta name="author" content="Jayden Wright">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-crossedoars-logo.png" alt="A logo depicting a white water raft">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-main">
        <!-- Top Company Info Header -->
        <section class="company-header">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <!-- Middle Section: Map on Left, Form on Right -->
        <div class="map-form-container">
            <section class="map-section">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d46083.56586071536!2d-113.93170725!3d45.1764639!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5359a35e72e12dbd%3A0x8e82a613f1d3c01c!2sSalmon%2C%20ID%2083467!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus"
                  width="100%" height="100%" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                  title="Google Map location of Whitewater Rafting">
                </iframe>
            </section>

            <section class="contact-form-section">
                <form action="#" method="post" class="contact-form">
                    <div class="form-row">
                        <label for="username">Name</label>
                        <input type="text" id="username" name="username" placeholder="Placeholder"
                          required>
                    </div>

                    <div class="form-row">
                        <label for="useremail">Email</label>
                        <input type="email" id="useremail" name="useremail"
                          placeholder="Placeholder" required>
                    </div>

                    <div class="form-row radio-row">
                        <label class="row-label">Message Purpose</label>
                        <div class="radio-options">
                            <label><input type="radio" id="general" name="purpose" value="general"
                                  checked> General Inquiry</label>
                            <label><input type="radio" id="reservation" name="purpose"
                                  value="reservation"> Reservation Question</label>
                            <label><input type="radio" id="suggestion" name="purpose"
                                  value="suggestion"> Website Suggestion</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Type here" rows="4"
                          required></textarea>
                    </div>

                    <div class="form-row checkbox-row">
                        <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                        <label for="newsletter">Please Subscribe me to the monthly
                            newsletter</label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </form>
            </section>
        </div>

        <!-- Employee Profiles Section -->
        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="team-grid">
                <figure>
                    <img src="images/employee-images.jpg" alt="Employee Profile 1">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-images.jpg" alt="Employee Profile 2">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-images.jpg" alt="Employee Profile 3">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>©️2026 | Whitewater Rafting | Jayden Wright</p>
        <nav class="socialmedia">
            <ul>
                <li>
                    <a href="https://facebook.com" target="_blank">
                        <img src="images/facebook-logotype.png" alt="Facebook logo">
                    </a>
                </li>
                <li>
                    <a href="https://linkedin.com" target="_blank">
                        <img src="images/linkedin-sign.png" alt="LinkedIn logo">
                    </a>
                </li>
                <li>
                    <a href="https://instagram.com" target="_blank">
                        <img src="images/instagram.png" alt="Instagram logo">
                    </a>
                </li>
            </ul>
        </nav>
    </footer>
</body>

</html>
