<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML & CSS Knowledge Quiz</h1>
    </header>

    <main>
        <form action="#" method="post">
            <!-- Question 1: Text Input -->
            <div class="form-item">
                <label for="q1">1. What does the "M" stand for in the abbreviation HTML?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <!-- Question 2: Textarea Element -->
            <div class="form-item">
                <label for="q2">2. Briefly explain the difference between HTML and CSS:</label>
                <textarea id="q2" name="q2" rows="4" placeholder="Type your response here..."
                  required></textarea>
            </div>

            <!-- Question 3: Select Element -->
            <div class="form-item">
                <label for="q3">3. Which CSS property is used to change the background color of an
                    element?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="color">color</option>
                    <option value="background-color">background-color</option>
                    <option value="bgcolor">bgcolor</option>
                    <option value="canvas-color">canvas-color</option>
                </select>
            </div>

            <!-- Question 4: Number Input Element -->
            <div class="form-item">
                <label for="q4">4. How many heading levels (e.g., h1 to h6) exist in HTML?</label>
                <input type="number" id="q4" name="q4" min="1" max="10" required>
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>

    <footer>
        <p>©2026 | HTML & CSS Quiz Activity</p>
    </footer>
</body>

</html>
