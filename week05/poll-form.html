<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form Activity</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item column2">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-item column2">
                    <label for="usermail">Email</label>
                    <input type="email" id="usermail" name="usermail" required>
                </div>
            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <div class="form-item column1">
                    <label for="browser">What is your Favorite Browser</label>
                    <select name="browser" id="browser">
                        <option value="1">Chrome</option>
                        <option value="2">Firefox</option>
                        <option value="3">Bing</option>
                    </select>
                </div>
                <div class="form-item column1">
                    <label><input type="checkbox" id="pet" name="pet">Do you have a household
                        pet?</label>
                </div>
                <div class="form-item stacked">
                    <label for="placeslived">List the places you have lived</label>
                    <textarea id="feedback" name="feedback" rows="4"
                      placeholder="Dallas, Texas; Honolulu, Hawaii; Juneau, Alaska;"></textarea>
                </div>
            </fieldset>

            <button type="submit">Submit Poll</button>
        </form>

    </main>
    <footer>
        <p>©️ | Poll Form Activity | Jayden Wright</p>
    </footer>
</body>

</html>
